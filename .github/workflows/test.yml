name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The suite parses the compose yaml with Bun.YAML, so the runner needs a
          # Bun that has it.
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
